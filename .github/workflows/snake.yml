name: Generate contribution snake

on:
  schedule:
    # Weekly, not daily: the account's Actions minutes are a shared, exhausted
    # pool, and a contribution snake that is a week old looks the same to a
    # visitor. ~4 runs a month instead of ~30. Run it by hand any time from the
    # Actions tab.
    - cron: "0 4 * * 0"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

# Never cancelled halfway: the second step force-pushes the generated SVGs to
# the `output` branch, and an interrupted push is worse than a wasted run.
concurrency:
  group: generate-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
