<svg xmlns="http://www.w3.org/2000/svg" width="400" height="38" viewBox="0 0 400 38"
     role="img" aria-label="seek and optimize and automate and">
  <title>seek and optimize and automate and</title>
  <!--
    A belt of three identical copies of the motto, sliding right to left by
    exactly one period and starting over, so the seam never shows.

    period = text width (347) + the gap standing in for the space (10) = 357.
    Three copies at 0, 357 and 714 cover the 400-wide window at both ends of
    the travel, so nothing blank ever scrolls through. textLength pins each
    copy to 347 whatever monospace font the reader has, which is what keeps
    the period exact.
  -->
  <style>
    .word {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                   "DejaVu Sans Mono", "Liberation Mono", monospace;
      font-size: 17px;
      fill: #58A6FF;
    }
    .belt { animation: slide 10s linear infinite; }
    @keyframes slide {
      from { transform: translateX(0px); }
      to   { transform: translateX(-357px); }
    }
    /* Someone who asked their system for less motion gets the words standing still. */
    @media (prefers-reduced-motion: reduce) {
      .belt { animation: none; transform: translateX(0px); }
    }
  </style>
  <g class="belt">
    <text class="word" x="0" y="24" textLength="347">seek and optimize and automate and</text>
    <text class="word" x="357" y="24" textLength="347">seek and optimize and automate and</text>
    <text class="word" x="714" y="24" textLength="347">seek and optimize and automate and</text>
  </g>
</svg>
